<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>share into cellar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ping-f543d9/styles.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0a0a0a}
[data-app='cellar']{--primary:215 16% 47%;--ring:215 16% 47%;--ping-accent-soft:hsl(215 16% 47% / 0.15)}
[data-app='cellar'] .ping-chip[aria-pressed='true']{color:hsl(215 20% 75%)}
p,h1,h2,h3{margin:0}
a{color:hsl(215 20% 70%)}a:hover{color:#fafafa}
button,textarea{font:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',var(--font-mono)}
</style>
</helmet>
<div data-app="cellar" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f4f4f5; color: hsl(var(--foreground)); font-family: 'Spline Sans', var(--font-display)">

<div aria-hidden="true" style="position: absolute; inset: 0; padding: 48px 18px; display: flex; flex-direction: column; gap: 12px; color: #18181b">
<div style="height: 44px; border-radius: 10px; background: #ffffff; display: flex; align-items: center; padding: 0 14px; gap: 10px"><span style="width: 22px; height: 22px; border-radius: 6px; background: #d4d4d8"></span><span style="font-size: 15px; font-weight: 700">checkout</span></div>
<div style="height: 70px; border-radius: 10px; background: #ffffff"></div>
<div style="height: 70px; border-radius: 10px; background: #ffffff"></div>
<div style="height: 46px; border-radius: 99px; background: #18181b"></div>
<div style="height: 40px; border-radius: 10px; background: #fee2e2; color: #991b1b; display: flex; align-items: center; padding: 0 14px; font-size: 13px; font-weight: 600">couldn't place your order</div>
</div>
<div style="position: absolute; inset: 0; background: var(--ping-backdrop-sheet)"></div>

<section role="dialog" aria-label="file it into cellar" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; box-sizing: border-box; background: hsl(var(--background)); border-top: 1px solid hsl(var(--border)); border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<div style="height: 28px; flex: none; display: flex; align-items: center; justify-content: center"><span style="width: 36px; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.25)"></span></div>
<div class="px-4" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 class="text-lg font-bold">file it into cellar</h2>
<button type="button" style="height: 36px; padding: 0 12px; border: 0; border-radius: 99px; background: transparent; color: #a3a3a3; cursor: pointer" class="text-sm">cancel</button>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start">
<div aria-label="the shared screenshot" style="width: 72px; height: 150px; flex: none; border-radius: 10px; border: 2px solid #262626; background: #f4f4f5; box-sizing: border-box; padding: 10px 6px; display: flex; flex-direction: column; gap: 5px; overflow: hidden">
<span style="height: 9px; border-radius: 2px; background: #ffffff"></span><span style="height: 18px; border-radius: 2px; background: #ffffff"></span><span style="height: 18px; border-radius: 2px; background: #ffffff"></span><span style="height: 10px; border-radius: 99px; background: #18181b"></span><span style="height: 9px; border-radius: 2px; background: #fee2e2"></span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="words" class="text-xs text-muted-foreground">in your words</label>
<textarea id="words" rows="3" style="resize: none; border-radius: 12px; border: 1px solid hsl(var(--border)); background: hsl(var(--secondary)); color: #fafafa; padding: 10px 12px; font-size: 14px; line-height: 20px">checkout button does nothing on the second tap</textarea>
<p class="text-xs text-muted-foreground">screenshot from the browser · the text on it is attached too</p>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<p class="text-xs font-bold uppercase tracking-widest text-muted-foreground">kind <span style="text-transform: none; letter-spacing: 0; font-weight: 500">· guessed from the screenshot</span></p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
<button type="button" class="ping-chip" aria-pressed="{{k.on}}" onClick="{{k.pick}}" style="min-height: 36px; cursor: pointer; border: 1px solid {{k.border}}; box-sizing: border-box">{{k.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<p class="text-xs font-bold uppercase tracking-widest text-muted-foreground">project</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" class="ping-chip" aria-pressed="true" style="min-height: 36px; border: 1px solid hsl(var(--primary)); box-sizing: border-box">web-shop</button>
<button type="button" class="ping-chip" aria-pressed="false" style="min-height: 36px; border: 1px solid transparent; box-sizing: border-box">notes-app</button>
<button type="button" class="ping-chip" aria-pressed="false" style="min-height: 36px; border: 1px solid transparent; box-sizing: border-box">inbox · decide later</button>
</div>
</div>

<div style="display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 12px; background: var(--ping-row-ground)">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<p class="text-sm font-semibold">hand it off now</p>
<p class="text-xs text-muted-foreground">{{recipeLine}}</p>
<a href="#recipe" class="text-xs">edit this kind's recipe</a>
</div>
<button type="button" role="switch" aria-checked="{{handoff}}" aria-label="hand it off now" onClick="{{toggleHandoff}}" style="width: 44px; height: 26px; flex: none; border-radius: 99px; border: 0; padding: 3px; background: {{track}}; cursor: pointer; display: flex; justify-content: {{side}}"><span style="width: 20px; height: 20px; border-radius: 99px; background: #fafafa"></span></button>
</div>
</div>
<div class="px-4" style="flex: none; padding-top: 12px; padding-bottom: 28px; border-top: 1px solid hsl(var(--border) / 0.5)">
<button type="button" style="width: 100%; height: 52px; border-radius: 99px; border: 0; background: hsl(var(--foreground)); color: hsl(var(--background)); cursor: pointer" class="text-base font-semibold">{{fileLabel}}</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const kind = s.kind || 'glitch';
    const handoff = s.handoff !== false;
    const recipes = {
      glitch: 'glitch recipe: reproduce → fix → add a test → $try-on-phone · claude · edits ok',
      idea: 'idea recipe: write a short plan and wait for you · claude · ask first',
      research: 'research recipe: read the link, summarise it into the entry · codex',
      design: 'design recipe: /frontend-design, then $preview · claude · edits ok',
      question: 'question recipe: answer it from the code, no edits · codex · ask first'
    };
    return {
      handoff: handoff,
      track: handoff ? 'hsl(215 16% 47%)' : '#404040',
      side: handoff ? 'flex-end' : 'flex-start',
      toggleHandoff: () => this.setState({ handoff: !handoff }),
      recipeLine: handoff ? recipes[kind] : 'just files it — hand it off later from the entry',
      fileLabel: handoff ? 'file it and hand it off' : 'file it',
      kinds: ['glitch', 'idea', 'research', 'design', 'question'].map((k) => ({
        label: k,
        on: k === kind,
        border: k === kind ? 'hsl(var(--primary))' : 'transparent',
        pick: () => this.setState({ kind: k })
      }))
    };
  }
}
</script>
</body>
</html>
